[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my_tools_package"
version = "0.1.0"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "faiss-cpu>=1.13.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pillow>=12.1.1",
    "pytorch-lightning>=2.6.1",
    "pytorch-metric-learning>=2.9.0",
    "requests>=2.32.5",
    "tbparse>=0.0.9",
    "tensorboard>=2.20.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchvision>=0.25.0",
    "transformers[torch]>=5.3.0",
] 

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}
py-modules = ["config"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
